<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Taylor Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b1613; --panel: rgba(255,255,255,0.04); --panel-border: rgba(94,230,165,0.18);
        --accent: #4ade80; --accent-soft: #7dffc0; --text: #e8f5ee; --text-muted: #8fae9c;
        --mono: 'JetBrains Mono', monospace; --sans: 'Space Grotesk', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; color: var(--text); font-family: var(--sans); text-align: center;
        background:
            radial-gradient(circle at 18% 12%, rgba(74,222,128,0.10), transparent 42%),
            radial-gradient(circle at 85% 78%, rgba(56,189,178,0.09), transparent 45%),
            repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 42px),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 42px),
            var(--bg);
        min-height: 100vh;
    }
    a { text-decoration: none; }
    nav {
        position: sticky; top: 0; z-index: 10; background-color: rgba(11,22,19,0.85);
        backdrop-filter: blur(10px); padding: 16px 20px; border-bottom: 1px solid var(--panel-border);
        display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;
    }
    nav a { color: var(--text-muted); font-family: var(--mono); font-size: 0.85em; font-weight: 600; padding: 7px 12px; border-radius: 6px; transition: 0.2s; letter-spacing: 0.5px; }
    nav a:hover { color: var(--accent-soft); background-color: rgba(94,230,165,0.08); }
    nav a.active { color: var(--bg); background-color: var(--accent); }

    .page-wrap { max-width: 600px; margin: 0 auto; padding: 60px 20px 40px; }
    .eyebrow { font-family: var(--mono); color: var(--accent); font-size: 0.85em; letter-spacing: 1px; margin-bottom: 10px; }
    h1 { font-size: 2.2em; margin: 0 0 8px; font-weight: 700; }
    .divider { width: 60px; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-soft)); border-radius: 2px; margin: 20px auto 40px; }

    .photo-container { margin: 0 auto 50px; }
    .photo-container img {
        width: 100%; max-width: 420px; border-radius: 14px;
        border: 2px solid var(--panel-border); box-shadow: 0 0 30px rgba(74,222,128,0.15);
    }

    .lab-question h2 { color: var(--text); font-size: 1.4em; margin-bottom: 28px; }
    .button-playground {
        position: relative; height: 220px; margin: 0 auto 50px;
        display: flex; align-items: center; justify-content: center; gap: 20px;
        background-color: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
    }
    button {
        font-family: var(--mono); font-weight: 600; padding: 14px 30px; font-size: 1em;
        border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    #yesBtn {
        background-color: transparent; color: var(--accent); border: 1px solid var(--accent);
    }
    #yesBtn:hover { background-color: var(--accent); color: var(--bg); box-shadow: 0 0 20px rgba(74,222,128,0.4); }
    #noBtn {
        background-color: transparent; color: var(--text-muted); border: 1px solid var(--panel-border);
        transition: left 0.15s ease, top 0.15s ease;
    }

    .back-link { display: inline-block; margin-top: 10px; color: var(--accent); font-family: var(--mono); font-size: 0.9em; }
    .back-link:hover { color: var(--accent-soft); }
</style>
</head>
<body>

<nav>
    <a href="index.html">home</a>
    <a href="research.html">research_&amp;_skills</a>
    <a href="experience.html">experience</a>
    <a href="professors.html" class="active">for_professors</a>
</nav>

<div class="page-wrap">

    <p class="eyebrow">$ sudo add_to_lab --candidate=sarah</p>
    <h1>Hi Professors!</h1>
    <div class="divider"></div>

    <div class="photo-container">
        <img src="sarah_professors.png" alt="Sarah Taylor">
    </div>

    <div class="lab-question">
        <h2>Would you want me in your lab?</h2>
        <div class="button-playground" id="playground">
            <a href="mailto:mtsarah016@gmail.com?subject=I'd love to have you in my lab!">
                <button id="yesBtn">yes</button>
            </a>
            <button id="noBtn">no</button>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; back_to_home</a>

</div>

<script>
    const noBtn = document.getElementById('noBtn');
    const playground = document.getElementById('playground');

    function moveButton() {
        const containerRect = playground.getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();
        const maxX = containerRect.width - btnRect.width - 10;
        const maxY = containerRect.height - btnRect.height - 10;
        const newX = Math.random() * maxX;
        const newY = Math.random() * maxY;
        noBtn.style.position = 'absolute';
        noBtn.style.left = newX + 'px';
        noBtn.style.top = newY + 'px';
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', function (e) { e.preventDefault(); moveButton(); });
    noBtn.addEventListener('click', function (e) { e.preventDefault(); moveButton(); });
</script>

</body>
</html>
