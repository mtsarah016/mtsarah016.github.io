<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah Taylor Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 15% 10%, #ddf0e8 0%, transparent 40%),
                        radial-gradient(circle at 85% 90%, #d8ecec 0%, transparent 40%),
                        #eaf6f6;
            color: #2e4d3f;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }

        h1 {
            color: #3a7d5c;
            font-size: 2.4em;
            margin-bottom: 8px;
        }

        .divider {
            width: 80px;
            height: 4px;
            background-color: #4caf7d;
            border-radius: 2px;
            margin: 20px auto 40px;
        }

        a {
            text-decoration: none;
        }

        .photo-container {
            max-width: 500px;
            margin: 0 auto 50px;
        }

        .photo-container img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(58, 125, 92, 0.35);
            border: 4px solid white;
        }

        .lab-question h2 {
            color: #3a7d5c;
            font-size: 1.6em;
            margin-bottom: 30px;
        }

        .button-playground {
            position: relative;
            max-width: 500px;
            height: 220px;
            margin: 0 auto 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
        }

        button {
            background-color: #4caf7d;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76, 175, 125, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background-color: #3a8f66;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(76, 175, 125, 0.55);
        }

        #noBtn {
            transition: left 0.15s ease, top 0.15s ease;
        }

        #noBtn:hover {
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #3a7d5c;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Hi Professors!</h1>
    <div class="divider"></div>

    <div class="photo-container">
        <img src="sarah_professors.png" alt="Sarah Taylor">
    </div>

    <div class="lab-question">
        <h2>Would you want me in your lab?</h2>
        <div class="button-playground" id="playground">
            <a href="mailto:mtsarah016@gmail.com?subject=I'd love to have you in my lab!">
                <button id="yesBtn">Yes</button>
            </a>
            <button id="noBtn">No</button>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; Back to home</a>

    <script>
        const noBtn = document.getElementById('noBtn');
        const playground = document.getElementById('playground');

        function moveButton() {
            const containerRect = playground.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = containerRect.width - btnRect.width - 10;
            const maxY = containerRect.height - btnRect.height - 10;

            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            noBtn.style.position = 'absolute';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', function (e) {
            e.preventDefault();
            moveButton();
        });
        noBtn.addEventListener('click', function (e) {
            e.preventDefault();
            moveButton();
        });
    </script>

</body>
</html>
